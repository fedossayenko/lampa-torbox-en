name = "torbox-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2026-07-01"
workers_dev = true

# -en fork: film grades shared between Lampa devices signed in to the same CUB account (see /grades).
[[kv_namespaces]]
binding = "GRADES"
id = "e224f2eb45e84ee49fc9fe6e4521b2cd"

# lampa-native: resume points shared by lampa-native and Lampa (see /timeline; table: timeline.sql).
[[d1_databases]]
binding = "DB"
database_name = "lampa-timeline"
database_id = "f19bd34f-0798-4808-8127-ed4d02eec688"

# lampa-native search index (titles.sql): English, then Russian (TITLE_CRONS in the worker); hourly: New in 4K at
# 04 UTC (uhd.sql), For you the other hours (foryou.sql; HOURLY_CRON).
[triggers]
crons = ["7 3 * * *", "37 3 * * *", "23 * * * *"]
